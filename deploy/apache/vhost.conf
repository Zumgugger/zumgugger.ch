# Apache Virtual Host Configuration Template for WebsiteCMS
# Replace variables: {{DOMAIN}}, {{SITENAME}}, {{APP_PORT}}
#
# Usage:
#   1. Copy this file to /etc/apache2/sites-available/{{SITENAME}}.conf
#   2. Replace all {{variables}} with actual values
#   3. Run: sudo a2ensite {{SITENAME}}.conf
#   4. Run: sudo systemctl reload apache2
#   5. Run certbot to add SSL

# HTTP - Redirect to HTTPS
<VirtualHost *:80>
    ServerName {{DOMAIN}}
    ServerAlias www.{{DOMAIN}}
    
    # Redirect all HTTP traffic to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
    
    # Allow Let's Encrypt verification
    <Directory /var/www/html/.well-known/acme-challenge>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>

# HTTPS - Main Configuration
<VirtualHost *:443>
    ServerName {{DOMAIN}}
    ServerAlias www.{{DOMAIN}}
    
    # SSL Configuration (will be managed by Certbot)
    SSLEngine on
    # SSLCertificateFile /etc/letsencrypt/live/{{DOMAIN}}/fullchain.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/{{DOMAIN}}/privkey.pem
    # Include /etc/letsencrypt/options-ssl-apache.conf
    
    # HSTS Header - Enforce HTTPS for 1 day (increase after testing)
    # Note: Per spec, no includeSubDomains and no preload
    Header always set Strict-Transport-Security "max-age=86400"
    
    # Security Headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
    
    # Proxy Configuration
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:{{APP_PORT}}/
    ProxyPassReverse / http://127.0.0.1:{{APP_PORT}}/
    
    # Forward client IP and protocol
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"
    
    # Timeout settings for long-running requests
    ProxyTimeout 60
    
    # Note: No Apache-level request body limit per spec
    # App handles upload limits via MAX_UPLOAD_SIZE env var
    
    # Error pages (optional - customize as needed)
    # ErrorDocument 500 /error/500.html
    # ErrorDocument 502 /error/502.html
    # ErrorDocument 503 /error/503.html
    
    # Logging
    ErrorLog ${APACHE_LOG_DIR}/{{SITENAME}}_error.log
    CustomLog ${APACHE_LOG_DIR}/{{SITENAME}}_access.log combined
    
    # Log level (reduce in production)
    LogLevel warn
</VirtualHost>

