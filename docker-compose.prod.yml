# Production override for docker-compose
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  websitecms:
    # Use pre-built image in production instead of building
    # image: websitecms:latest
    
    # Override port binding - use environment variable for multi-site support
    ports:
      - "127.0.0.1:${APP_PORT:-30000}:8002"
    
    # Production environment overrides
    environment:
      - DEBUG=false
      - LOG_LEVEL=WARNING
    
    # Stricter resource limits for production
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'
    
    # More aggressive health checks in production
    healthcheck:
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    
    # Production logging with rotation
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "5"
        labels: "service"
        tag: "{{.Name}}/{{.ID}}"
